exclude: |
  (?x)^(
      \.idea/|
      target/|
      build/|
      dist/|
      .*\.iml|
      \.DS_Store
  )

repos:
  # Basic hygiene (fast)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
      - id: mixed-line-ending
        stages: [pre-commit]
      - id: check-added-large-files
        stages: [pre-commit]

  # Optional: shell script linting
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
        files: ^scripts/.*\.sh$
        stages: [pre-commit]

  - repo: https://github.com/crate-ci/typos
    rev: v1.42.3
    hooks:
      - id: typos
        stages: [pre-commit]


  # Optional: format YAML nicely (if you want)
  # - repo: https://github.com/adrienverge/yamllint
  #   rev: v1.35.1
  #   hooks:
  #     - id: yamllint

  # Rust hooks (local so we control toolchain/target)
  - repo: local
    hooks:
      - id: cargo-fmt
        files: \.rs$
        name: cargo fmt (workspace)
        entry: bash -lc 'cargo +nightly fmt --all'
        language: system
        pass_filenames: false
        stages: [pre-commit]

# ------ tetsu-boot ------

      - id: cargo-check-uefi-boot
        files: ^tetsu-boot/.*\.rs$
        name: cargo check (tetsu-boot uefi)
        entry: bash -lc 'cargo +nightly check -p tetsu-boot --target x86_64-unknown-uefi'
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: cargo-check-uefi-boot-tests
        files: ^tetsu-boot-tests/.*\.rs$
        name: cargo check (tetsu-boot-tests uefi)
        entry: bash -lc 'cargo +nightly check -p tetsu-boot-tests --target x86_64-unknown-uefi'
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: cargo-clippy-uefi-boot
        files: ^tetsu-boot/.*\.rs$
        name: cargo clippy (tetsu-boot uefi)
        entry: bash -lc 'cargo +nightly clippy -p tetsu-boot --target x86_64-unknown-uefi -- -D warnings'
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: cargo-clippy-uefi-boot-tests
        files: ^tetsu-boot-tests/.*\.rs$
        name: cargo clippy (tetsu-boot-tests uefi)
        entry: bash -lc 'cargo +nightly clippy -p tetsu-boot-tests --target x86_64-unknown-uefi -- -D warnings'
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: cargo-build-uefi-boot
        files: ^tetsu-boot/.*\.rs$
        name: cargo build (tetsu-boot uefi)
        entry: bash -lc 'cargo +nightly build -p tetsu-boot --target x86_64-unknown-uefi'
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: cargo-build-uefi-boot-tests
        files: ^tetsu-boot-tests/.*\.rs$
        name: cargo build (tetsu-boot-tests uefi)
        entry: bash -lc 'cargo +nightly build -p tetsu-boot-tests --target x86_64-unknown-uefi'
        language: system
        pass_filenames: false
        stages: [pre-push]

# ------ tetsu-kernel ------

      - id: cargo-check-kernel
        files: ^tetsu-kernel/.*\.rs$
        name: cargo check (tetsu-kernel)
        entry: bash -lc 'cargo +nightly check -p tetsu-kernel -Zjson-target-spec -Z build-std=core -Z build-std-features=compiler-builtins-mem --target tetsu-kernel/x86_64-tetsu-kernel.json'
