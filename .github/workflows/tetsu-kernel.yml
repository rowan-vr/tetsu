name: tetsu-kernel

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    needs: [check, clippy]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure scripts are executable
        run: chmod +x scripts/*.sh

      - name: Set up Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: kernel-tests

      - name: Build tetsu-kernel binary
        run: cargo +nightly build -p tetsu-kernel --Zjson-target-spec -Z build-std=core -Z build-std-features=compiler-builtins-mem --target tetsu-kernel/x86_64-tetsu-kernel.json

  build-tests:
    runs-on: ubuntu-latest
    needs: [check-tests, clippy-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure scripts are executable
        run: chmod +x scripts/*.sh

      - name: Set up Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: kernel-tests

      - name: Build tetsu-kernel-tests binary
        run: cargo +nightly build -p tetsu-kernel-tests --Zjson-target-spec -Z build-std=core -Z build-std-features=compiler-builtins-mem --target tetsu-kernel/x86_64-tetsu-kernel.json

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: kernel-check

      - name: Cargo check
        run: cargo +nightly check -p tetsu-kernel --Zjson-target-spec -Z build-std=core -Z build-std-features=compiler-builtins-mem --target tetsu-kernel/x86_64-tetsu-kernel.json

  check-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: kernel-check

      - name: Cargo check (tests)
        run: cargo +nightly check -p tetsu-kernel-tests --Zjson-target-spec -Z build-std=core -Z build-std-features=compiler-builtins-mem --target tetsu-kernel/x86_64-tetsu-kernel.json

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust nightly (clippy)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: kernel-clippy

      - name: Clippy
        run: cargo +nightly clippy -p tetsu-kernel --Zjson-target-spec -Z build-std=core -Z build-std-features=compiler-builtins-mem --target tetsu-kernel/x86_64-tetsu-kernel.json -- -D warnings

  clippy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust nightly (clippy)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: kernel-clippy

      - name: Clippy (tests)
        run: cargo +nightly clippy -p tetsu-kernel-tests --Zjson-target-spec -Z build-std=core -Z build-std-features=compiler-builtins-mem --target tetsu-kernel/x86_64-tetsu-kernel.json -- -D warnings

  test-kernel:
    runs-on: ubuntu-latest
    needs: [build, build-tests]   # optional but recommended
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps (QEMU + OVMF)
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf mtools dosfstools

      - name: Set up Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: kernel-tests

      - name: Ensure scripts are executable
        run: chmod +x scripts/*.sh

      - name: Run Kernel test image binary under QEMU
        env:
          RUN_HEADLESS: "1"
        run: |
          timeout 180s cargo +nightly test -p tetsu-kernel-tests --Zjson-target-spec -Z build-std=core -Z build-std-features=compiler-builtins-mem --target tetsu-kernel/x86_64-tetsu-kernel.json -v
