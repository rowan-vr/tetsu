name: tetsu-boot-tests

on:
  push:
  pull_request:

jobs:
  test-uefi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps (QEMU + OVMF)
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 edk2-ovmf mtools dosfstools

      - name: Set up Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: x86_64-unknown-uefi

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: uefi-tests

      - name: Ensure scripts are executable
        run: |
          chmod +x scripts/*.sh

      - name: Run UEFI test binary under QEMU
        run: |
          cargo +nightly test-boot
